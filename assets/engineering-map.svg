<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 244" width="900" height="244" role="img" aria-labelledby="t d">
  <title id="t">Engineering focus map</title>
  <desc id="d">Electronics Engineering, VLSI Design and Technology, branching into RTL and ASIC implementation, DFT and test, analog and mixed-signal design, semiconductor process TCAD, and embedded hardware.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .h  { font-size: 15px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: #e6edf3; }
    .tl { font-size: 11.5px; fill: #c9d6e3; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ln { stroke: #8b949e; stroke-width: 1.5; fill: none; }
  </style>

  <!-- root -->
  <rect x="245" y="6" width="410" height="60" rx="8" fill="#16324f"/>
  <text x="450" y="32" style="font-size:18px;font-weight:600">Electronics Engineering</text>
  <text x="450" y="53" class="s">VLSI Design and Technology</text>

  <!-- connectors -->
  <path class="ln" d="M450 66 V88 M90 88 H810 M90 88 V110 M270 88 V110 M450 88 V110 M630 88 V110 M810 88 V110"/>

  <!-- branches -->
  <g>
    <rect x="10" y="110" width="160" height="128" rx="8" fill="#1d4e89"/>
    <text x="90" y="136" class="h">RTL · ASIC</text>
    <text x="90" y="162" class="s">Synthesis · STA</text>
    <text x="90" y="181" class="s">Place &amp; route</text>
    <line x1="30" y1="198" x2="150" y2="198" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="90" y="220" class="tl">Genus · Innovus</text>
  </g>
  <g>
    <rect x="190" y="110" width="160" height="128" rx="8" fill="#22578f"/>
    <text x="270" y="136" class="h">DFT · Test</text>
    <text x="270" y="162" class="s">Scan insertion</text>
    <text x="270" y="181" class="s">ATPG · Fault coverage</text>
    <line x1="210" y1="198" x2="330" y2="198" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="270" y="220" class="tl">Tessent</text>
  </g>
  <g>
    <rect x="370" y="110" width="160" height="128" rx="8" fill="#285f86"/>
    <text x="450" y="136" class="h">Analog · AMS</text>
    <text x="450" y="162" class="s">PLL · ADC</text>
    <text x="450" y="181" class="s">Sampling switch</text>
    <line x1="390" y1="198" x2="510" y2="198" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="450" y="220" class="tl">Virtuoso · Spectre</text>
  </g>
  <g>
    <rect x="550" y="110" width="160" height="128" rx="8" fill="#2c6474"/>
    <text x="630" y="136" class="h">Semiconductor</text>
    <text x="630" y="162" class="s">STI process flow</text>
    <text x="630" y="181" class="s">Defect analysis</text>
    <line x1="570" y1="198" x2="690" y2="198" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="630" y="220" class="tl">Sentaurus TCAD</text>
  </g>
  <g>
    <rect x="730" y="110" width="160" height="128" rx="8" fill="#46535f"/>
    <text x="810" y="136" class="h">Embedded HW</text>
    <text x="810" y="162" class="s">Sensors · ADC</text>
    <text x="810" y="181" class="s">Displays · Vision</text>
    <line x1="750" y1="198" x2="870" y2="198" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="810" y="220" class="tl">ESP32 · Arduino</text>
  </g>
</svg>
